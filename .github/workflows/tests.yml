name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y zsh shellcheck xxd
          else
            brew install shellcheck
          fi

      - name: Lint
        run: |
          bash -n bootstrap
          zsh -n dotfiles
          shellcheck -x bootstrap hooks/pre-push tests/run tests/lib.sh tests/*.test.sh

      - name: Tests
        run: tests/run
