name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y zsh shellcheck xxd
          else
            brew install shellcheck
          fi

      - name: Lint
        run: |
          bash -n bootstrap
          sh -n install.sh
          zsh -n dotfiles
          shellcheck -x bootstrap install.sh tests/run tests/lib.sh tests/*.test.sh

      - name: Tests
        run: tests/run
